name: CI/CD Build & Deploy Nakhatra Microservices to Server

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# A newer push supersedes an in-flight deploy instead of queueing behind it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO_OWNER: bibektimilsina00
  SERVER_HOST: 161.118.246.132
  SERVER_USER: ubuntu

jobs:
  # Each image is built natively per architecture — amd64 on ubuntu-latest,
  # arm64 on GitHub's arm runners (free for public repos) — and pushed by
  # digest. No QEMU: emulated compilation was most of the old build time.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: nakhatra-api
            dockerfile: ./apps/api/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: nakhatra-api
            dockerfile: ./apps/api/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: nakhatra-web
            dockerfile: ./Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: nakhatra-web
            dockerfile: ./Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # Digest-only push; the merge job assembles the multi-arch tag.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_HOST=${{ secrets.NEXT_PUBLIC_UMAMI_HOST }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into the :latest multi-arch tags.
  merge:
    name: Merge multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest lists
        working-directory: /tmp/digests
        run: |
          set -e
          api=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/nakhatra-api
          web=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/nakhatra-web
          alias=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/nakhatra

          docker buildx imagetools create -t "$api:latest" \
            $(printf "$api@sha256:%s " $(ls nakhatra-api))
          docker buildx imagetools create -t "$web:latest" -t "$alias:latest" \
            $(printf "$web@sha256:%s " $(ls nakhatra-web))

          docker buildx imagetools inspect "$api:latest"
          docker buildx imagetools inspect "$web:latest"

  deploy:
    name: Deploy Microservices Stack via SSH
    needs: merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository for Compose Config
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Remote Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/nakhatra/"

      - name: Deploy Microservices on Remote Server (ubuntu@161.118.246.132)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "========================================="
            echo "🚀 Launching Nakhatra Microservices Stack"
            echo "========================================="
            echo "server architecture: $(uname -m)"

            # 1. Login to GHCR on the remote server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Prepare deployment directory
            mkdir -p ~/nakhatra
            cd ~/nakhatra

            # 3. Dynamically generate .env file from GitHub Secrets
            echo "Generating production .env configuration..."
            cat << 'EOF' > .env
            PORT=3000
            NODE_ENV=production
            PYTHON_PATH=python3
            POSTGRES_DB=nakhatra
            POSTGRES_USER=nakhatra
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD || 'nakhatrapassword' }}"
            FASTAPI_URL=http://nakhatra_api:8000
            AGENT_ROUTER_API_KEY="${{ secrets.AGENT_ROUTER_API_KEY }}"
            AGENT_ROUTER_BASE_URL="${{ secrets.AGENT_ROUTER_BASE_URL }}"
            AGENT_ROUTER_MODEL="${{ secrets.AGENT_ROUTER_MODEL }}"
            OPEN_ROUTER_API_KEY="${{ secrets.OPEN_ROUTER_API_KEY }}"
            OPEN_ROUTER_BASE_URL="${{ secrets.OPEN_ROUTER_BASE_URL }}"
            OPEN_ROUTER_MODEL="${{ secrets.OPEN_ROUTER_MODEL }}"
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            LLM_BASE_URL="${{ secrets.LLM_BASE_URL }}"
            LLM_API_KEY="${{ secrets.LLM_API_KEY }}"
            LLM_MODEL="${{ secrets.LLM_MODEL }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            STUDIO_KEY="${{ secrets.STUDIO_KEY }}"
            TIKTOK_CLIENT_KEY="${{ secrets.TIKTOK_CLIENT_KEY }}"
            TIKTOK_CLIENT_SECRET="${{ secrets.TIKTOK_CLIENT_SECRET }}"
            R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}"
            R2_BUCKET="${{ secrets.R2_BUCKET }}"
            R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
            R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
            GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}"
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            CORS_ORIGINS='["https://nakhatra.com","https://www.nakhatra.com"]'
            NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}"
            NEXT_PUBLIC_POSTHOG_HOST="${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}"
            NEXT_PUBLIC_UMAMI_WEBSITE_ID="${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}"
            NEXT_PUBLIC_UMAMI_HOST="${{ secrets.NEXT_PUBLIC_UMAMI_HOST }}"
            NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}"
            EOF

            # 3b. The daily rashifal is a publication, not a per-request
            # generation: one AI call a day writes it, the table serves it.
            # 20:00 UTC is a little after 01:45 in Kathmandu, so tomorrow is
            # ready before anyone wakes to read it. Re-installing the line is
            # safe — it is matched and replaced, never appended twice.
            echo "Installing the daily rashifal job..."
            ( crontab -l 2>/dev/null | grep -v 'daily-rasifal' ; \
              echo "0 20 * * * cd ~/nakhatra && docker compose exec -T nakhatra_api uv run daily-rasifal >> ~/nakhatra/rasifal.log 2>&1" \
            ) | crontab -

            # 4. Pull microservice container images
            echo "Pulling latest microservice images..."
            docker compose pull

            # 5. Stop anything left from before the rename.
            #    These names are deliberately still `kundali*` — that is what
            #    they exist under on the server. Renaming them here would
            #    leave them running forever, holding ports 3000 and 5432.
            docker stop kundali-app 2>/dev/null || true
            docker rm kundali-app 2>/dev/null || true

            # 5a. One-time migration off the pre-rename stack.
            #     The compose project name used to come from the directory, so
            #     ~/kundali and ~/nakhatra do not share a volume. The database
            #     has to be carried across by hand, exactly once.
            BACKUP_DIR=~/nakhatra/backups
            RESTORE_MARK=~/nakhatra/.restored-from-kundali
            PENDING=""
            if [ ! -f "$RESTORE_MARK" ] && docker ps -a --format '{{.Names}}' | grep -qx 'kundali_postgres'; then
              echo "Found the pre-rename stack — taking a dump before touching anything."
              mkdir -p "$BACKUP_DIR"
              PENDING="$BACKUP_DIR/kundali-$(date +%Y%m%d-%H%M%S).sql"

              docker start kundali_postgres >/dev/null 2>&1 || true
              for i in $(seq 1 30); do
                docker exec kundali_postgres pg_isready -U kundali -d kundali >/dev/null 2>&1 && break
                sleep 2
              done

              # --no-owner/--no-acl: the old role is named `kundali` and does
              # not exist in the new cluster; without these the restore fails
              # on every GRANT.
              docker exec kundali_postgres \
                pg_dump -U kundali -d kundali --no-owner --no-acl > "$PENDING" || true

              if [ -s "$PENDING" ]; then
                echo "Dumped $(wc -c < "$PENDING") bytes to $PENDING"
                # Release the ports. The old volume is deliberately left in
                # place, so this is reversible until someone prunes it.
                (cd ~/kundali 2>/dev/null && docker compose down) || true
                docker rm -f kundali_postgres kundali_api kundali_web 2>/dev/null || true
              else
                echo "::error::pg_dump produced nothing — refusing to tear down the old stack."
                exit 1
              fi
            fi

            # 6. Launch 3 microservices (nakhatra_postgres, nakhatra_api, nakhatra_web)
            echo "Starting docker compose stack..."
            docker compose up -d

            # 8. Bring the schema up to date.
            #
            # Nothing else does this: `create_all` is for tests, and the image
            # does not migrate on boot. Without it a release that adds a table
            # deploys green and then 500s on the first request that touches it.
            # Runs after `up -d` so the database is accepting connections, and
            # is idempotent — an already-current schema is a no-op.
            echo "Applying database migrations..."
            docker compose exec -T nakhatra_api alembic upgrade head

            # 6a. Restore the pre-rename database into the renamed one, once.
            if [ -n "$PENDING" ] && [ -s "$PENDING" ]; then
              echo "Waiting for nakhatra_postgres before restoring..."
              for i in $(seq 1 45); do
                docker exec nakhatra_postgres pg_isready -U nakhatra -d nakhatra >/dev/null 2>&1 && break
                sleep 2
              done
              if docker exec -i nakhatra_postgres psql -v ON_ERROR_STOP=1 -U nakhatra -d nakhatra < "$PENDING"; then
                touch "$RESTORE_MARK"
                echo "Restored the previous database into 'nakhatra'."
              else
                echo "::error::Restore failed. The dump is kept at $PENDING and the"
                echo "::error::old volume was not removed, so this is recoverable."
                exit 1
              fi
            fi

            # 7. Prove the stack is actually serving before calling this a success.
            #    A previous image was missing half its dependencies and
            #    crash-looped 84 times while this job reported ✅, because
            #    nothing ever asked the containers whether they came up.
            echo "Waiting for the API to answer /health..."
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:28001/health >/dev/null 2>&1 && { API_UP=1; break; }
              sleep 2
            done
            if [ -z "$API_UP" ]; then
              echo "::error::API never became healthy. Last 40 lines:"
              docker logs --tail 40 nakhatra_api 2>&1 || true
              exit 1
            fi
            echo "API healthy."

            echo "Waiting for the web app..."
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:3000 2>/dev/null && { WEB_UP=1; break; }
              sleep 2
            done
            if [ -z "$WEB_UP" ]; then
              echo "::error::Web app never responded. Last 40 lines:"
              docker logs --tail 40 nakhatra_web 2>&1 || true
              exit 1
            fi
            echo "Web healthy."

            # 8. Clean up unused images to preserve VPS disk space
            docker image prune -f

            echo "========================================="
            echo "✅ Nakhatra Microservices Stack Deployed Successfully!"
            echo "🌐 Web:  https://nakhatra.com        (Caddy -> 127.0.0.1:3000)"
            echo "🔌 API:  https://api.nakhatra.com/health (Caddy -> 127.0.0.1:28001)"
            echo "========================================="
