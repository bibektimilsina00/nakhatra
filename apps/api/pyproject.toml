[project]
name = "nakhatra-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyswisseph>=2.10.3.2",
    "tzdata>=2024.1",          # historical zones; do not rely on the host tz db
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "email-validator>=2.3.0",
    "psycopg2-binary>=2.9.12",
    "argon2-cffi>=25.1.0",
    # [crypto] is not optional here: our own tokens are HS256, but Google
    # signs ID tokens with RS256 and bare PyJWT ships HMAC only. Without the
    # extra, every Google sign-in fails with MissingCryptographyError.
    "pyjwt[crypto]>=2.13.0",
    "anthropic>=1.4.0",
    "alembic>=1.19.2",
    "sqlmodel>=0.0.42",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "import-linter>=2.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# --- the boundary from docs/architecture.md §4 -----------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "astrology_core is pure"
type = "forbidden"
source_modules = ["app.astrology_core"]
forbidden_modules = [
    "fastapi", "sqlmodel", "sqlalchemy", "anthropic", "redis", "httpx",
    "app.modules", "app.core", "app.integrations",
]

[[tool.importlinter.contracts]]
# integrations/ wraps third-party services for modules to call. The dependency
# runs one way: a module imports an integration, never the reverse. Without this
# an integration reaches back into a module "just for a schema" and the two can
# no longer be reasoned about, or tested, separately.
name = "integrations do not depend on modules"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "swisseph is imported directly in exactly one module"
type = "forbidden"
# Indirect is fine and expected: chart.py calls into ephemeris.py, which is the
# single wrapper. What must never happen is a second module reaching for the
# raw library and quietly picking its own ayanamsa or house system.
allow_indirect_imports = true
source_modules = [
    "app.modules",
    "app.core",
    "app.astrology_core.chart",
    "app.astrology_core.dasha",
    "app.astrology_core.nakshatra",
    "app.astrology_core.models",
    "app.astrology_core.constants",
]
forbidden_modules = ["swisseph"]
