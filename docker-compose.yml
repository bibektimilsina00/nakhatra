# Pinned so volume names never depend on the directory name.
name: nakhatra

services:
  nakhatra_postgres:
    image: postgres:16-alpine
    container_name: nakhatra_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakhatra}
      POSTGRES_USER: ${POSTGRES_USER:-nakhatra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nakhatrapassword}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - nakhatra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakhatra} -d ${POSTGRES_DB:-nakhatra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nakhatra_api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${GHCR_IMAGE_API:-ghcr.io/bibektimilsina00/nakhatra-api:latest}
    container_name: nakhatra_api
    restart: always
    ports:
      # Loopback only: Caddy on the host terminates TLS for api.nakhatra.com and
      # proxies here. Published on 0.0.0.0 this was a second, unencrypted door
      # into the same API.
      - "127.0.0.1:28001:8000"
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nakhatra}:${POSTGRES_PASSWORD:-nakhatrapassword}@nakhatra_postgres:5432/${POSTGRES_DB:-nakhatra}
      # The LLM_* names the deploy actually writes, falling back to the
      # AgentRouter ones so an environment that still has only those keeps
      # working. Reading the key from AGENT_ROUTER_API_KEY while the base URL
      # points at OpenRouter sends the wrong provider's key and 401s exactly
      # like a bad key.
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api}
      - LLM_API_KEY=${LLM_API_KEY:-$AGENT_ROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemini-3.6-flash}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-[]}
      - JWT_SECRET=${JWT_SECRET}
      # Voice: the API synthesises TTS itself; without this the endpoint 503s
      # in production while working on every dev machine.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      nakhatra_postgres:
        condition: service_healthy

  nakhatra_web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GHCR_IMAGE_WEB:-ghcr.io/bibektimilsina00/nakhatra-web:latest}
    container_name: nakhatra_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FASTAPI_URL=http://nakhatra_api:8000
      - AGENT_ROUTER_API_KEY=${AGENT_ROUTER_API_KEY}
      - AGENT_ROUTER_BASE_URL=${AGENT_ROUTER_BASE_URL}
      - AGENT_ROUTER_MODEL=${AGENT_ROUTER_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # The rasifal studio: the Nepali voice, and the secret the slide route
      # demands. Unset STUDIO_KEY leaves /studio/rasifal a 404 and the
      # Generate button refusing to start — which is the safe way round.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STUDIO_KEY=${STUDIO_KEY}
      # YouTube publishing rides on the same Google OAuth client that signs
      # people in; the secret was API-only until the studio needed to mint
      # its own tokens.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      # Rendered videos. A volume rather than the container filesystem so a
      # deploy in the middle of the morning does not take the day's post with
      # it.
      - nakhatra_studio:/data/studio
    depends_on:
      - nakhatra_api

volumes:
  nakhatra_pgdata:
  nakhatra_studio:
